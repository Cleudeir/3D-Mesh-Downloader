<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>rasteriza icone</title></head>
<body>
<script type="module">
// Rasteriza src/icons/icon.svg nos tamanhos 16/32/48/128 e devolve data URLs.
const sizes = [16, 32, 48, 128];
const svg = await (await fetch('/src/icons/icon.svg')).text();

const img = new Image();
img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
await img.decode();

window.__icons = {};
for (const size of sizes) {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, size, size);
  window.__icons[size] = canvas.toDataURL('image/png');
}
window.__ready = true;
</script>
</body>
</html>
